<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Todo List</h1>
        </div>
        <div class="input-group">
            <input type="text" class="todo-input" id="todoInput" placeholder="Add a new task...">
            <button class="add-button" id="addButton">Add</button>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search tasks...">
            <span class="search-icon">🔍</span>
        </div>
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">
                📝
            </div>
            <ul class="todo-list" id="todoList">
                
            </ul>
            <p class="empty-state-text">
                No task yet, Add a new task to get started.
            </p>
        </div>
    </div>
</body>
</html>
